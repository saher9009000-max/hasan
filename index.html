<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مترجم برو | ترجمة حقيقية مجانية</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- الهيدر -->
    <header class="header">
        <div class="logo"><i class="fas fa-language"></i><h1>مترجم برو</h1></div>
        <button class="theme-btn" id="themeBtn" title="تبديل المظهر"><i class="fas fa-moon"></i></button>
    </header>

    <main class="container">
        <!-- بطاقة الترجمة الرئيسية -->
        <section class="translator-card">
            <!-- شريط اللغات -->
            <div class="lang-bar">
                <select id="srcLang" class="lang-select">
                    <option value="auto">🔍 كشف تلقائي</option>
                    <option value="ar">🇸🇦 العربية</option>
                    <option value="en">🇺🇸 الإنجليزية</option>
                    <option value="fr">🇫🇷 الفرنسية</option>
                    <option value="es">🇪🇸 الإسبانية</option>
                    <option value="de">🇩🇪 الألمانية</option>
                    <option value="tr">🇹🇷 التركية</option>
                    <option value="ru">🇷🇺 الروسية</option>
                    <option value="zh">🇨🇳 الصينية</option>
                    <option value="ja">🇯🇵 اليابانية</option>
                    <option value="ko">🇰🇷 الكورية</option>
                    <option value="pt">🇵🇹 البرتغالية</option>
                    <option value="it">🇮🇹 الإيطالية</option>
                    <option value="hi">🇮🇳 الهندية</option>
                    <option value="fa">🇮🇷 الفارسية</option>
                    <option value="ur">🇵🇰 الأردية</option>
                </select>

                <button class="swap-btn" id="swapBtn" title="تبديل اللغات"><i class="fas fa-exchange-alt"></i></button>

                <select id="tgtLang" class="lang-select">
                    <option value="en">🇺🇸 الإنجليزية</option>
                    <option value="ar">🇸🇦 العربية</option>
                    <option value="fr">🇫🇷 الفرنسية</option>
                    <option value="es">🇪🇸 الإسبانية</option>
                    <option value="de">🇩🇪 الألمانية</option>
                    <option value="tr">🇹🇷 التركية</option>
                    <option value="ru">🇷🇺 الروسية</option>
                    <option value="zh">🇨🇳 الصينية</option>
                    <option value="ja">🇯🇵 اليابانية</option>
                    <option value="ko">🇰🇷 الكورية</option>
                    <option value="pt">🇵🇹 البرتغالية</option>
                    <option value="it">🇮🇹 الإيطالية</option>
                    <option value="hi">🇮🇳 الهندية</option>
                    <option value="fa">🇮🇷 الفارسية</option>
                    <option value="ur">🇵🇰 الأردية</option>
                </select>
            </div>

            <!-- مناطق النص -->
            <div class="text-grid">
                <div class="text-box">
                    <textarea id="inputText" placeholder="اكتب أو الصق النص هنا..." maxlength="5000"></textarea>
                    <div class="box-tools">
                        <span class="counter" id="charCount">0 / 5000</span>
                        <div class="tools-right">
                            <button class="tool-btn" id="clearBtn" title="مسح"><i class="fas fa-trash-alt"></i></button>
                            <button class="tool-btn" id="speakSrc" title="استماع"><i class="fas fa-volume-up"></i></button>
                        </div>
                    </div>
                </div>

                <button class="translate-btn" id="translateBtn">
                    <i class="fas fa-bolt"></i> ترجم الآن
                </button>

                <div class="text-box output">
                    <textarea id="outputText" readonly placeholder="الترجمة الحقيقية ستظهر هنا..."></textarea>
                    <div class="box-tools">
                        <div class="tools-right">
                            <button class="tool-btn" id="copyBtn" title="نسخ"><i class="fas fa-copy"></i></button>
                            <button class="tool-btn" id="speakTgt" title="استماع"><i class="fas fa-volume-up"></i></button>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- أدوات إضافية -->
        <div class="extras-grid">
            <!-- استيراد الملفات -->
            <section class="extra-card">
                <h3><i class="fas fa-file-import"></i> استيراد ملف</h3>
                <div class="drop-zone" id="dropZone">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>اسحب الملف هنا أو انقر</p>
                    <small>TXT, DOC, PDF</small>
                    <input type="file" id="fileInput" accept=".txt,.doc,.docx" hidden>
                </div>
                <div id="fileStatus" class="file-status" style="display:none;">
                    <i class="fas fa-file-alt"></i>
                    <span id="fileName"></span>
                    <button id="removeFile" class="tool-btn sm"><i class="fas fa-times"></i></button>
                </div>
            </section>

            <!-- الترجمة الصوتية -->
            <section class="extra-card">
                <h3><i class="fas fa-microphone-lines"></i> ترجمة صوتية</h3>
                <div class="voice-ui">
                    <button class="voice-btn start" id="startRec"><i class="fas fa-microphone"></i> تحدث الآن</button>
                    <button class="voice-btn stop" id="stopRec" disabled><i class="fas fa-stop"></i> إيقاف</button>
                </div>
                <div class="rec-status" id="recStatus">
                    <div class="dot"></div> جاري الاستماع...
                </div>
                <div id="voiceOutput" class="voice-output" style="display:none;"></div>
            </section>
        </div>
    </main>

    <footer class="footer">&copy; 2026 مترجم برو - ترجمة حقيقية مجانية</footer>
    <script src="script.js"></script>
</body>
</html>
