<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مترجم الذكاء الاصطناعي الاحترافي</title>
    <link rel="stylesheet" href="style.css">
    <!-- خط Cairo العصري -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body data-theme="light">

    <!-- رأس الصفحة -->
    <header class="app-header">
        <div class="logo">
            <i class="fa-solid fa-language"></i>
            <h1>مترجم الذكاء الاصطناعي</h1>
        </div>
        <button id="theme-toggle" class="icon-btn" aria-label="تبديل الوضع المرئي" title="تبديل الوضع">
            <i class="fa-solid fa-moon"></i>
        </button>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="app-main">
        <!-- شريط اختيار اللغات -->
        <div class="lang-bar">
            <div class="lang-select-group">
                <label for="source-lang">اللغة الأصلية:</label>
                <select id="source-lang">
                    <option value="auto">اكتشاف تلقائي</option>
                    <option value="ar">العربية</option>
                    <option value="en">الإنجليزية</option>
                    <option value="fr">الفرنسية</option>
                    <option value="es">الإسبانية</option>
                    <option value="de">الألمانية</option>
                    <option value="tr">التركية</option>
                </select>
            </div>

            <button id="swap-lang" class="icon-btn swap-btn" aria-label="تبديل اللغات" title="تبديل اللغات">
                <i class="fa-solid fa-right-left"></i>
            </button>

            <div class="lang-select-group">
                <label for="target-lang">اللغة المترجمة:</label>
                <select id="target-lang">
                    <option value="en" selected>الإنجليزية</option>
                    <option value="ar">العربية</option>
                    <option value="fr">الفرنسية</option>
                    <option value="es">الإسبانية</option>
                    <option value="de">الألمانية</option>
                    <option value="tr">التركية</option>
                </select>
            </div>
        </div>

        <!-- لوحة الترجمة (صندوق الإدخال وصندوق النتيجة) -->
        <div class="translator-grid">
            <!-- صندوق النص الأصلي -->
            <div class="panel source-panel">
                <div class="panel-header">
                    <span>النص الأصلي</span>
                    <div class="panel-actions">
                        <button id="paste-btn" class="text-btn" title="لصق النص">
                            <i class="fa-solid fa-paste"></i> لصق
                        </button>
                        <button id="clear-btn" class="text-btn" title="مسح النص">
                            <i class="fa-solid fa-trash-can"></i> مسح
                        </button>
                    </div>
                </div>
                <div class="textarea-wrapper">
                    <textarea id="source-text" placeholder="اكتب أو ألصق النص هنا للترجمة... (اضغط Ctrl + Enter للترجمة)"></textarea>
                </div>
                <div class="panel-footer">
                    <span class="char-count"><span id="char-counter">0</span> / 5000</span>
                    <button id="copy-source" class="icon-btn sm" title="نسخ النص الأصلي">
                        <i class="fa-solid fa-copy"></i>
                    </button>
                </div>
            </div>

            <!-- صندوق الترجمة -->
            <div class="panel target-panel">
                <div class="panel-header">
                    <span>الترجمة بالذكاء الاصطناعي</span>
                </div>
                <div class="textarea-wrapper">
                    <textarea id="target-text" placeholder="ستظهر الترجمة هنا..." readonly></textarea>
                    
                    <!-- حالة التحميل -->
                    <div id="loading-overlay" class="state-overlay hidden">
                        <div class="spinner"></div>
                        <span>جاري معالجة الترجمة...</span>
                    </div>

                    <!-- حالة الخطأ -->
                    <div id="error-overlay" class="state-overlay hidden">
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        <span id="error-message">تعذر الاتصال بخدمة الترجمة.</span>
                    </div>
                </div>
                <div class="panel-footer">
                    <span></span>
                    <button id="copy-target" class="icon-btn sm" title="نسخ النتيجة">
                        <i class="fa-solid fa-copy"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- زر الترجمة الرئيسي -->
        <div class="action-container">
            <button id="translate-btn" class="primary-btn">
                <i class="fa-solid fa-wand-magic-sparkles"></i> ترجمة بالذكاء الاصطناعي
            </button>
        </div>

        <!-- قسم سجل الترجمات السابقة -->
        <section class="history-section">
            <div class="history-header">
                <h2><i class="fa-solid fa-clock-rotate-left"></i> الترجمات السابقة</h2>
                <button id="clear-history" class="text-btn sm">مسح السجل</button>
            </div>
            <div id="history-list" class="history-list">
                <div class="empty-history">لا توجد ترجمات سابقة حتى الآن.</div>
            </div>
        </section>
    </main>

    <!-- حاوية التنبيهات الموقّتة (Toasts) -->
    <div id="toast-container" class="toast-container"></div>

    <script src="script.js"></script>
</body>
</html>
