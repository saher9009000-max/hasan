<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoFlow - ترجمة فورية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
        }

        header {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 20px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-icon {
            background-color: #6366f1;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: bold;
        }

        .icon-btn {
            background-color: #1a2332;
            border: 1px solid #2d3748;
            color: #a0aec0;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .hero {
            text-align: center;
            max-width: 500px;
            margin-bottom: 20px;
        }

        .hero h1 {
            font-size: 1.75rem;
            margin-bottom: 8px;
            font-weight: 800;
        }

        .hero p {
            color: #94a3b8;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .start-btn {
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .translate-card {
            background-color: #131b2e;
            border: 1px solid #212d45;
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            padding: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }

        /* إصلاح الخانات بشكل كامل لمنع انقطاع النص */
        .language-selectors {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 15px;
            width: 100%;
        }

        .select-wrapper {
            flex: 1;
            width: 100%;
        }

        select {
            width: 100%;
            background-color: #1d283d;
            color: #ffffff;
            border: 1px solid #334361;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            text-align: center;
            appearance: auto; /* إظهار السهم بشكل افتراضي صحيح */
        }

        .swap-btn {
            background-color: #1d283d;
            border: 1px solid #334361;
            color: #ffffff;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 1.2rem;
        }

        .input-box {
            background-color: #0b0f19;
            border: 1px solid #212d45;
            border-radius: 14px;
            padding: 12px;
        }

        textarea {
            width: 100%;
            height: 130px;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            line-height: 1.5;
        }

        textarea::placeholder {
            color: #64748b;
        }

        /* أزرار الأدوات: صوت + استيراد + ترجمة */
        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #1d283d;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tool-group {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            background-color: #1d283d;
            border: 1px solid #334361;
            color: #cbd5e1;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-action:hover {
            background-color: #334361;
            color: #ffffff;
        }

        .btn-action.recording {
            background-color: #ef4444;
            color: #ffffff;
            border-color: #f87171;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        #fileInput {
            display: none;
        }

        .translate-btn {
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .translate-btn:hover {
            background-color: #4f46e5;
        }

        /* في الشاشات الصغيرة جداً توضع خانات الاختيار تحت بعض لضمان العرض التام بدون قطع */
        @media (max-width: 360px) {
            .language-selectors {
                flex-direction: column;
            }
            .swap-btn
