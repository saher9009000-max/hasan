<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaPro - ترجمة احترافية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>

  <!-- الهيدر -->
  <header class="header">
    <div class="logo">
      <span class="logo-icon">🌐</span>
      <span class="logo-text">LinguaPro</span>
      <span class="version-badge">v1.0.0</span>
    </div>
    <div class="header-actions">
      <!-- زر تبديل لغة الواجهة -->
      <button class="icon-btn" id="uiLangBtn" title="تغيير لغة الواجهة">عربي/EN</button>
      <!-- زر الوضع الداكن/الفاتح -->
      <button class="icon-btn" id="themeBtn" title="الوضع الداكن/الفاتح">🌙</button>
    </div>
  </header>

  <!-- القسم الرئيسي -->
  <main class="main-container">
    <div class="hero">
      <h1 class="hero-title" id="heroTitle">ترجم أي شيء بدقة احترافية</h1>
      <p class="hero-sub" id="heroSub">ترجمة فورية بالذكاء الاصطناعي تدعم أكثر من 140 لغة — نصوص، ملفات، صور وصوت.</p>
    </div>

    <!-- التبويبات -->
    <div class="tabs-container">
      <button class="tab-btn active" data-target="text-panel" id="tabText">📝 نص</button>
      <button class="tab-btn" data-target="file-panel" id="tabFile">📁 ملفات</button>
      <button class="tab-btn" data-target="audio-panel" id="tabAudio">🎤 صوت</button>
    </div>

    <!-- لوحة النص -->
    <div class="panel active" id="text-panel">
      <div class="lang-select-group">
        <select class="lang-select" id="srcLangText"></select>
        <button class="swap-btn" id="swapTextLangs" title="تبديل">⇄</button>
        <select class="lang-select" id="tgtLangText"></select>
      </div>
      <textarea id="textInput" placeholder="اكتب أو الصق النص هنا للترجمة..."></textarea>
      <button class="btn-primary" id="translateTextBtn">ترجم الآن ✨</button>
    </div>

    <!-- لوحة الملفات -->
    <div class="panel" id="file-panel">
      <div class="lang-select-group">
        <select class="lang-select" id="tgtLangFile"></select>
      </div>
      <div class="dropzone" id="dropzone">
        <div class="drop-icon">📄</div>
        <p class="drop-title">اسحب وأفلت ملفك هنا</p>
        <p class="drop-hint">PDF, DOCX, TXT, PNG, JPG, MP3, WAV</p>
        <input type="file" id="fileInput" hidden>
        <button class="btn-secondary" id="browseBtn">اختر ملفاً</button>
      </div>
      <div class="file-preview hidden" id="filePreview">
        <span id="fileName">اسم الملف</span>
        <button class="btn-remove" id="clearFileBtn">✕</button>
      </div>
      <button class="btn-primary" id="translateFileBtn" disabled>ترجم الملف 🚀</button>
    </div>

    <!-- لوحة الصوت -->
    <div class="panel" id="audio-panel">
      <div class="lang-select-group">
        <select class="lang-select" id="tgtLangAudio"></select>
      </div>
      <div class="audio-recorder">
        <button class="record-btn" id="recordBtn">🎤</button>
        <p class="record-status" id="recordStatus">اضغط للتسجيل الصوتي</p>
      </div>
      <button class="btn-primary" id="translateAudioBtn">ترجم الصوت ✨</button>
    </div>

    <!-- النتيجة -->
    <div class="result-box hidden" id="resultBox">
      <div class="result-header">
        <span class="result-title" id="resultTitle">النتيجة</span>
        <button class="btn-secondary small" id="copyBtn">نسخ 📋</button>
      </div>
      <div class="result-text" id="resultText"></div>
    </div>
  </main>

  <!-- الفوتر -->
  <footer class="footer">
    <p>© 2026 LinguaPro — <span id="footerVersion">الإصدار 1.0.0</span> — جميع الحقوق محفوظة</p>
  </footer>

  <script src="./script.js"></script>
</body>
</html>
