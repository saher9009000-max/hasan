<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مترجم برو - ترجمة احترافية</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="logo">
            <i class="fas fa-language"></i>
            <h1>مترجم برو</h1>
        </div>
        <nav class="nav">
            <button class="theme-toggle" id="themeToggle" title="تبديل المظهر">
                <i class="fas fa-moon"></i>
            </button>
        </nav>
    </header>

    <main class="container">
        <!-- Translation Section -->
        <section class="translation-section">
            <div class="language-selector">
                <select id="sourceLang" class="lang-select">
                    <option value="auto">الكشف التلقائي</option>
                    <option value="ar">العربية</option>
                    <option value="en">الإنجليزية</option>
                    <option value="fr">الفرنسية</option>
                    <option value="es">الإسبانية</option>
                    <option value="de">الألمانية</option>
                    <option value="tr">التركية</option>
                    <option value="zh">الصينية</option>
                    <option value="ja">اليابانية</option>
                    <option value="ko">الكورية</option>
                    <option value="ru">الروسية</option>
                    <option value="pt">البرتغالية</option>
                    <option value="it">الإيطالية</option>
                </select>
                
                <button class="swap-btn" id="swapLang" title="تبديل اللغات">
                    <i class="fas fa-exchange-alt"></i>
                </button>
                
                <select id="targetLang" class="lang-select">
                    <option value="en">الإنجليزية</option>
                    <option value="ar">العربية</option>
                    <option value="fr">الفرنسية</option>
                    <option value="es">الإسبانية</option>
                    <option value="de">الألمانية</option>
                    <option value="tr">التركية</option>
                    <option value="zh">الصينية</option>
                    <option value="ja">اليابانية</option>
                    <option value="ko">الكورية</option>
                    <option value="ru">الروسية</option>
                    <option value="pt">البرتغالية</option>
                    <option value="it">الإيطالية</option>
                </select>
            </div>

            <div class="translation-box">
                <div class="input-area">
                    <textarea id="inputText" placeholder="أدخل النص للترجمة..." maxlength="5000"></textarea>
                    <div class="input-actions">
                        <button class="action-btn" id="clearBtn" title="مسح النص"><i class="fas fa-trash"></i></button>
                        <button class="action-btn" id="speakInput" title="قراءة النص"><i class="fas fa-volume-up"></i></button>
                        <span class="char-count" id="charCount">0 / 5000</span>
                    </div>
                </div>

                <button class="translate-btn" id="translateBtn">
                    <i class="fas fa-language"></i> ترجم الآن
                </button>

                <div class="output-area">
                    <textarea id="outputText" readonly placeholder="الترجمة ستظهر هنا..."></textarea>
                    <div class="output-actions">
                        <button class="action-btn" id="copyBtn" title="نسخ الترجمة"><i class="fas fa-copy"></i></button>
                        <button class="action-btn" id="speakOutput" title="قراءة الترجمة"><i class="fas fa-volume-up"></i></button>
                    </div>
                </div>
            </div>
        </section>

        <!-- File Upload Section -->
        <section class="file-section">
            <h2><i class="fas fa-file-upload"></i> استيراد الملفات</h2>
            <div class="upload-zone" id="uploadZone">
                <i class="fas fa-cloud-upload-alt"></i>
                <p>اسحب الملف هنا أو انقر للاختيار</p>
                <p class="supported-formats">يدعم: TXT, DOC, PDF</p>
                <input type="file" id="fileInput" accept=".txt,.doc,.docx,.pdf" hidden>
                <button class="upload-btn" id="uploadBtn">اختيار ملف</button>
            </div>
            <div class="file-info" id="fileInfo" style="display: none;">
                <i class="fas fa-file-alt"></i>
                <span id="fileName"></span>
                <button class="remove-file" id="removeFile" title="إزالة الملف"><i class="fas fa-times"></i></button>
            </div>
        </section>

        <!-- Voice Translation Section -->
        <section class="voice-section">
            <h2><i class="fas fa-microphone"></i> الترجمة الصوتية</h2>
            <div class="voice-controls">
                <button class="voice-btn" id="startRecord">
                    <i class="fas fa-microphone"></i> بدء التسجيل
                </button>
                <button class="voice-btn stop-record" id="stopRecord" disabled>
                    <i class="fas fa-stop"></i> إيقاف
                </button>
                <div class="recording-status" id="recordingStatus">
                    <div class="pulse"></div>
                    <span>جاري الاستماع...</span>
                </div>
            </div>
            <div class="voice-result" id="voiceResult" style="display: none;">
                <h3>النص المعرّف:</h3>
                <p id="voiceText"></p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 مترجم برو - تصميم وتطوير احترافي</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
