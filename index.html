<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ترجمة | موقع الترجمة الاحترافي</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- الهيدر -->
  <header class="header">
    <div class="header-right">
      <button class="icon-btn" id="langBtn">English</button>
    </div>
    <div class="main-logo">ترجمة</div>
    <div class="header-left">
      <button class="icon-btn" id="themeBtn">🌙</button>
    </div>
  </header>

  <main class="container">
    <div class="tabs">
      <button class="tab active" data-target="text-panel" id="tabText">نص</button>
      <button class="tab" data-target="file-panel" id="tabFile">ملفات</button>
    </div>

    <!-- لوحة النص -->
    <div class="panel active" id="text-panel">
      <div class="lang-group">
        <select class="lang-select" id="srcLang"></select>
        <button class="swap-btn" id="swapBtn">⇄</button>
        <select class="lang-select" id="tgtLang"></select>
      </div>
      <textarea id="textInput" placeholder="اكتب النص هنا للترجمة..."></textarea>
      <button class="btn-primary" id="translateBtn">ترجم الآن</button>
    </div>

    <!-- لوحة الملفات -->
    <div class="panel" id="file-panel">
      <div class="lang-group">
        <select class="lang-select" id="tgtFileLang"></select>
      </div>
      <div class="dropzone" id="dropzone">
        <div class="drop-icon">📁</div>
        <p class="drop-title">اسحب وأفلت ملفك هنا</p>
        <p class="drop-hint">PDF, DOCX, TXT, صور</p>
        <input type="file" id="fileInput" hidden>
        <button class="btn-secondary" id="browseBtn">اختر ملفاً</button>
      </div>
      <div class="file-preview hidden" id="filePreview">
        <span id="fileName">اسم الملف</span>
        <button class="btn-remove" id="clearFileBtn">✕</button>
      </div>
      <button class="btn-primary" id="translateFileBtn" disabled>ترجم الملف</button>
    </div>

    <!-- النتيجة -->
    <div class="result-box hidden" id="resultBox">
      <div class="result-header">
        <span class="result-title">النتيجة</span>
        <button class="btn-secondary" id="copyBtn">نسخ</button>
      </div>
      <div class="result-text" id="resultText"></div>
    </div>
  </main>

  <footer class="footer">
    <p>© 2026 ترجمة | الإصدار 1.0.0</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
