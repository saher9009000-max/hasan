<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoFlow - ترجمة فورية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 20px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            background-color: #6366f1;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: bold;
        }

        .icon-btn {
            background-color: #161b22;
            border: 1px solid #30363d;
            color: #8b949e;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .hero {
            text-align: center;
            max-width: 500px;
            margin-bottom: 25px;
        }

        .hero h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            font-weight: 800;
        }

        .hero p {
            color: #8b949e;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        .translate-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 18px;
            width: 100%;
            max-width: 600px;
            padding: 16px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
        }

        /* إصلاح حقول اللغات حتى لا ينقطع الكلام */
        .language-selectors {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .select-wrapper {
            flex: 1;
            min-width: 0;
        }

        select {
            width: 100%;
            background-color: #21262d;
            color: #ffffff;
            border: 1px solid #30363d;
            padding: 10px 8px;
            border-radius: 10px;
            font-size: 0.85rem;
            outline: none;
            cursor: pointer;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
            text-align: center;
        }

        .swap-btn {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #ffffff;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .input-box {
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 12px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 0.95rem;
            resize: none;
            outline: none;
        }

        textarea::placeholder {
            color: #484f58;
        }

        /* أزرار الأدوات: صوت + استيراد + ترجمة */
        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #21262d;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tool-group {
            display: flex;
            gap: 8px;
        }

        .btn-action {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-action:hover {
            background-color: #30363d;
            color: #ffffff;
        }

        .btn-action.recording {
            background-color: #da3633;
            color: #ffffff;
            border-color: #f85149;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        #fileInput {
            display: none;
        }

        .translate-btn {
            background-color: #6366f1;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }

        .translate-btn:hover {
            background-color: #4f46e5;
        }
    </style>
</head>
<body>

    <header>
        <button class="icon-btn">☰</button>
        <div class="logo-container">
            <span class="logo-text">LingoFlow</span>
            <div class="logo-icon">🌐</div>
        </div>
        <button class="icon-btn">⚙</button>
    </header>

    <div class="hero">
        <h1>كل اللغات أقرب مما تتخيل.</h1>
        <p>ترجم نصوك فورياً وبدقة عالية بين أكثر من 100 لغة عالمية مع تجربة
