<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عازل الصوت بالذكاء الاصطناعي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Cairo', sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; padding: 20px; text-align: center; }
        .header { display: flex; justify-content: space-between; align-items: center; padding: 15px 0; max-width: 600px; margin: 0 auto; }
        .logo { font-weight: bold; font-size: 1.2rem; color: #4f46e5; }
        .card { background: white; border-radius: 20px; padding: 30px 20px; max-width: 600px; margin: 20px auto; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h1 { font-size: 1.8rem; margin-bottom: 15px; color: #0f172a; }
        p { color: #64748b; font-size: 0.95rem; line-height: 1.6; margin-bottom: 25px; }
        .upload-area { border: 2px dashed #cbd5e1; border-radius: 15px; padding: 30px; background: #fafafa; cursor: pointer; }
        input[type="file"] { display: none; }
        .btn { background: #4f46e5; color: white; padding: 12px 25px; border-radius: 10px; border: none; font-weight: bold; font-size: 1rem; cursor: pointer; margin-top: 15px; width: 100%; }
        .btn:hover { background: #4338ca; }
        #audioResults { margin-top: 25px; display: none; }
        audio { width: 100%; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">🎙️ VocalRemover</div>
    </div>

    <div class="card">
        <h1>عزل الغناء عن الموسيقى</h1>
        <p>قم برفع الملف الصوتي ليتم فصل الصوت البشري عن الموسيقى مجاناً.</p>

        <form id="uploadForm">
            <label for="audioFile" class="upload-area">
                <span>📁 اضغط هنا لاختيار ملف صوتي</span>
                <input type="file" id="audioFile" accept="audio/*" required>
            </label>
            <button type="submit" class="btn">شروع في عزل الصوت</button>
        </form>

        <div id="audioResults">
            <h3>النتائج:</h3>
            <p>الصوت البشري فقط:</p>
            <audio id="vocalsAudio" controls></audio>
            <p style="margin-top:15px;">الموسيقى فقط:</p>
            <audio id="noVocalsAudio" controls></audio>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
