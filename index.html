<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoFlow - ترجمة فورية</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            background-color: #0b0f19;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0 25px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            background-color: #5856d6;
            color: #fff;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .logo-text {
            font-size: 20px;
            font-weight: 700;
        }

        .icon-btn {
            background-color: #1c2333;
            border: 1px solid #2a3447;
            color: #a0aec0;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .hero {
            text-align: center;
            max-width: 500px;
            margin-bottom: 30px;
        }

        .hero h1 {
            font-size: 2rem;
            margin-bottom: 12px;
            font-weight: 800;
            line-height: 1.3;
        }

        .hero p {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        .main-btn {
            background-color: #5856d6;
            color: #ffffff;
            border: none;
            padding: 12px 28px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .main-btn:hover {
            background-color: #4845d2;
        }

        .translate-card {
            background-color: #131927;
            border: 1px solid #1e293b;
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        /* إصلاح خانات اختيار اللغات لمنع قطع النصوص */
        .language-selectors {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 15px;
        }

        .select-wrapper {
            flex: 1;
            min-width: 0; /* منع تجاوز الحاوية */
        }

        select {
            width: 100%;
            background-color: #1e293b;
            color: #ffffff;
            border: 1px solid #334155;
            padding: 10px 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
            text-overflow: ellipsis;
            white-space: nowrap;
            overflow: hidden;
        }

        .swap-btn {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #ffffff;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .input-box {
            position: relative;
            background-color: #0b0f19;
            border: 1px solid #1e293b;
            border-radius: 14px;
            padding: 12px;
        }

        textarea {
            width: 100%;
            height: 120px;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 0.95rem;
            resize: none;
            outline: none;
        }

        textarea::placeholder {
            color: #64748b;
        }

        /* زر استيراد الملفات وشريط الأدوات */
        .actions-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #1e293b;
        }

        .file-btn {
            background-color: #1e293b;
            border: 1px solid #334155;
            color: #cbd5e1;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .file-btn:hover {
            background-color: #334155;
            color: #ffffff;
        }

        #fileInput {
            display: none;
        }

        .translate-btn {
            background-color: #5856d6;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <header>
        <button class="icon-btn">☰</button>
        <div class="logo-container">
            <span class="logo-text">LingoFlow</span>
            <div class="logo-icon">🌐</div>
        </div>
        <button class="icon-btn">⚙</button>
    </header>

    <div class="hero">
        <h1>كل اللغات أقرب مما تتخيل.</h1>
        <p>ترجم نصوك فورياً وبدقة عالية بين أكثر من 100 لغة عالمية مع تجربة مستخدم سلسة وخالية من التعقيد.</p>
        <button class="main-btn" onclick="document.getElementById('inputText').focus()">ابدأ الترجمة الآن ↓</button>
    </div>

    <div class="translate-card">
        <div class="language-selectors">
            <!-- اللغة المصدر -->
            <div class="select-wrapper">
                <select id="sourceLang"></select>
            </div>

            <!-- زر التبديل -->
            <button class="swap-btn" onclick="swapLanguages()" title="تبديل اللغات">⇄</button>

            <!-- اللغة الهدف -->
            <div class="select-wrapper">
                <select id="targetLang"></select>
            </div>
        </div>

        <div class="input-box">
            <textarea id="inputText" placeholder="اكتب أو الصق النص هنا للترجمة..."></textarea>
            
            <div class="actions-bar">
                <!-- زر استيراد الملفات -->
                <label for="fileInput" class="file-btn">
                    📁 استيراد ملف
                </label>
                <input type="file" id="fileInput" accept=".txt" onchange="handleFileUpload(event)">

                <button class="translate-btn" onclick="translateText()">تر
