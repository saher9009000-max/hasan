<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مترجم برو | ترجمة احترافية</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- الهيدر -->
    <header class="header">
        <div class="logo">
            <i class="fas fa-language"></i>
            <h1>مترجم برو</h1>
        </div>
        <button class="theme-toggle" id="themeToggle" title="تبديل المظهر">
            <i class="fas fa-moon"></i>
        </button>
    </header>

    <main class="container">
        <!-- قسم الترجمة النصية -->
        <section class="translation-card">
            <div class="lang-selector">
                <select id="sourceLang" class="lang-select">
                    <option value="auto">الكشف التلقائي</option>
                    <option value="ar">العربية</option>
                    <option value="en">الإنجليزية</option>
                    <option value="fr">الفرنسية</option>
                    <option value="es">الإسبانية</option>
                    <option value="de">الألمانية</option>
                    <option value="tr">التركية</option>
                </select>
                
                <button class="swap-btn" id="swapBtn"><i class="fas fa-exchange-alt"></i></button>
                
                <select id="targetLang" class="lang-select">
                    <option value="en">الإنجليزية</option>
                    <option value="ar">العربية</option>
                    <option value="fr">الفرنسية</option>
                    <option value="es">الإسبانية</option>
                    <option value="de">الألمانية</option>
                    <option value="tr">التركية</option>
                </select>
            </div>

            <div class="text-areas">
                <div class="input-box">
                    <textarea id="inputText" placeholder="اكتب النص هنا للترجمة..." maxlength="5000"></textarea>
                    <div class="box-actions">
                        <span class="char-count" id="charCount">0/5000</span>
                        <button class="icon-btn" id="clearBtn"><i class="fas fa-trash"></i></button>
                        <button class="icon-btn" id="speakInput"><i class="fas fa-volume-up"></i></button>
                    </div>
                </div>

                <button class="translate-btn" id="translateBtn">
                    <i class="fas fa-bolt"></i> ترجم الآن
                </button>

                <div class="output-box">
                    <textarea id="outputText" readonly placeholder="الترجمة ستظهر هنا..."></textarea>
                    <div class="box-actions">
                        <button class="icon-btn" id="copyBtn"><i class="fas fa-copy"></i></button>
                        <button class="icon-btn" id="speakOutput"><i class="fas fa-volume-up"></i></button>
                    </div>
                </div>
            </div>
        </section>

        <!-- قسم استيراد الملفات والترجمة الصوتية -->
        <div class="tools-grid">
            <!-- استيراد الملفات -->
            <section class="tool-card">
                <h2><i class="fas fa-file-import"></i> استيراد ملف</h2>
                <div class="upload-zone" id="uploadZone">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <p>اسحب الملف هنا أو انقر للاختيار</p>
                    <p class="sub-text">TXT, DOC, PDF</p>
                    <input type="file" id="fileInput" accept=".txt,.doc,.docx,.pdf" hidden>
                </div>
                <div id="fileInfo" class="file-info" style="display:none;">
                    <i class="fas fa-file-alt"></i>
                    <span id="fileName"></span>
                    <button id="removeFile" class="icon-btn small"><i class="fas fa-times"></i></button>
                </div>
            </section>

            <!-- الترجمة الصوتية -->
            <section class="tool-card">
                <h2><i class="fas fa-microphone-lines"></i> ترجمة صوتية</h2>
                <div class="voice-controls">
                    <button class="voice-btn record" id="startRecord">
                        <i class="fas fa-microphone"></i> ابدأ التحدث
                    </button>
                    <button class="voice-btn stop" id="stopRecord" disabled>
                        <i class="fas fa-stop"></i> إيقاف
                    </button>
                </div>
                <div class="recording-indicator" id="recordingIndicator">
                    <div class="pulse-dot"></div>
                    <span>جاري الاستماع...</span>
                </div>
                <div id="voiceResult" class="voice-result" style="display:none;"></div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <p>&copy; 2026 مترجم برو - تصميم احترافي عالي الدقة</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
